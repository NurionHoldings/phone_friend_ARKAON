name: android-test-apk

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-test-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  test-and-package:
    name: Android test and internal APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable the Unix Gradle wrapper
        run: chmod +x android/gradlew
      - name: Verify the ARKAON Core contracts
        run: npm run verify
      - name: Run Android unit tests and build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Create internal-test metadata
        shell: bash
        run: |
          set -euo pipefail
          apk_path="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk_path"
          mkdir -p release-assets
          cp "$apk_path" release-assets/phone-friend-test.apk
          (cd release-assets && sha256sum phone-friend-test.apk > phone-friend-test.apk.sha256)
          checksum=$(cut -d ' ' -f 1 release-assets/phone-friend-test.apk.sha256)
          version_name=$(awk -F '"' '/^[[:space:]]*versionName = "[^"]+"/ { print $2 }' android/app/build.gradle.kts)
          version_code=$(awk '/^[[:space:]]*versionCode = [0-9]+/ { print $3 }' android/app/build.gradle.kts)
          min_android_sdk=$(awk '/^[[:space:]]*minSdk = [0-9]+/ { print $3 }' android/app/build.gradle.kts)
          test -n "$version_name"
          test -n "$version_code"
          test -n "$min_android_sdk"
          cat > release-assets/phone-friend-test.json <<EOF
          {
            "name": "PHONE FRIEND internal test APK",
            "versionName": "${version_name}",
            "versionCode": ${version_code},
            "minAndroidSdk": ${min_android_sdk},
            "commit": "${GITHUB_SHA}",
            "sha256": "${checksum}",
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "installScope": "internal-test-only"
          }
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phone-friend-test-apk
          if-no-files-found: error
          path: |
            release-assets/phone-friend-test.apk
            release-assets/phone-friend-test.apk.sha256
            release-assets/phone-friend-test.json

  publish-internal-test-release:
    name: Publish internal-test prerelease
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phone-friend-test-apk
          path: release-assets
      - name: Create the immutable internal-test prerelease when absent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_name="phone-friend-test-${GITHUB_SHA::12}"
          if gh release view "$tag_name" >/dev/null 2>&1; then
            echo "Internal-test prerelease already exists: $tag_name"
            exit 0
          fi
          gh release create "$tag_name" \
            --title "PHONE FRIEND internal test ${GITHUB_SHA::12}" \
            --prerelease \
            --notes "Android internal-test build only. Verify the SHA-256 file before installation." \
            release-assets/phone-friend-test.apk \
            release-assets/phone-friend-test.apk.sha256 \
            release-assets/phone-friend-test.json
